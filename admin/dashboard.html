<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Halframe Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Memanggil CSS Modular dengan path mundur (../) -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css"> <!-- Untuk base style tombol -->
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

    <!-- SIDEBAR -->
     <!-- GANTI DENGAN INI SAJA -->
        <div id="admin-sidebar-placeholder"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content" style="margin-left: 260px; padding: 40px 5%; width: calc(100% - 260px); box-sizing: border-box;">
        
        <header class="admin-header">
            <h1>Overview</h1>
            <div class="admin-profile" style="display: flex; align-items: center; gap: 12px;">
                <div style="text-align: right;">
                    <span style="display: block; font-weight: 600;" id="adminWelcomeName">Admin</span>
                    <span id="adminRoleBadge" style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">Loading...</span>
                </div>
                
                <!-- IKON USER SVG (Menggantikan tag <img>) -->
                <div id="adminUserIcon" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border: 2px solid var(--border-color); transition: all 0.3s ease;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); transition: color 0.3s ease;">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
            </div>
        </header>

        <!-- STATISTIC CARDS -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>New Bookings</h3>
                <div class="stat-value" id="stat-pending">0</div>
                <p class="stat-desc">Awaiting your review</p>
            </div>
            <div class="stat-card">
                <h3>Active Projects</h3>
                <div class="stat-value" id="stat-approved">0</div>
                <p class="stat-desc">Approved & In Progress</p>
            </div>
            <div class="stat-card">
                <h3>Completed Projects</h3>
                <div class="stat-value" id="stat-completed">0</div>
                <p class="stat-desc">
                    Successfully delivered <br>
                    <button id="dashboardReportBtn" style="background: transparent; border: none; cursor: pointer; color: var(--accent); font-size: 12px; padding: 0; margin-top: 8px; font-family: 'Inter', sans-serif;">⬇️ Download Report</button>
                </p>
            </div>
        </div>

        <!-- RECENT BOOKINGS TABLE -->
        <section class="admin-section">
            <div class="section-header-admin">
                <h2>Recent Booking Requests</h2>
                <a href="manage-bookings.html" class="btn-outline-small">Manage All</a>
            </div>
            <div class="table-container">
                <!-- Tambahkan ID dashboardTableBody -->
                <table class="admin-table" id="dashboardTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Client / Company</th>
                            <th>Service</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="dashboardTableBody">
                        <!-- Data riil dari database akan dimuat di sini secara otomatis -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- TAMBAHKAN BARIS INI AGAR TOMBOL DI DASHBOARD BERFUNGSI -->
    <script src="../js/admin.js"></script>
    <script src="../js/admin-loader.js"></script>
    
</body>
</html>
