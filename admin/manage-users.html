<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | Halframe Admin</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    
    <style>
        /* Desain Tabel Admin */
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
        .admin-table th, .admin-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .admin-table th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        .admin-table tr:hover { background: rgba(255,255,255,0.02); }
        
        /* Badge Role */
        .badge { padding: 5px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .badge.super_admin { background: rgba(255, 183, 3, 0.1); color: #ffb703; border: 1px solid rgba(255, 183, 3, 0.3); }
        .badge.admin { background: rgba(46, 204, 113, 0.1); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); }
        .badge.user { background: rgba(255, 255, 255, 0.1); color: var(--text-light); border: 1px solid rgba(255, 255, 255, 0.3); }

        /* Tombol Aksi */
        .action-btn { background: transparent; border: none; cursor: pointer; font-size: 0.85rem; text-decoration: underline; margin-right: 15px; }
        .edit-btn { color: #3498db; }
        .del-btn { color: #e50914; }

        /* Jendela Modal Edit */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: var(--bg-card); padding: 40px; border-radius: 8px; width: 100%; max-width: 450px; border: 1px solid var(--border-color); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: white; border-radius: 4px; outline: none; box-sizing: border-box; }
        .form-group input:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body style="background-color: var(--bg-dark); margin: 0;">

    <div style="display: flex; min-height: 100vh;">
        <!-- Penampung Sidebar Admin -->
        <div id="admin-sidebar-placeholder"></div>

        <!-- Konten Utama -->
        <main style="flex: 1; margin-left: 260px; padding: 60px 5%; width: calc(100% - 260px); box-sizing: border-box;">
            <div style="max-width: 1000px;">
                <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 30px;">
                    <div>
                        <h2 style="font-size: 2rem; margin-bottom: 5px; text-transform: uppercase;">Manage Users</h2>
                        <p style="color: var(--text-muted);">Kelola data seluruh klien dan atur hak akses admin (Role).</p>
                    </div>
                </div>

                <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Nama / Perusahaan</th>
                                <th>Email</th>
                                <th>Role Akses</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr>
                                <td colspan="4" style="text-align: center; padding: 30px; color: var(--text-muted);">Memuat data pengguna...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL EDIT AKUN -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px; font-size: 1.3rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">Edit Hak Akses User</h3>
            <form id="editForm">
                <input type="hidden" id="editUserId">
                
                <div class="form-group">
                    <label>Email (Terkunci)</label>
                    <input type="email" id="editUserEmail" disabled>
                </div>

                <div class="form-group">
                    <label>Nama Lengkap / Perusahaan</label>
                    <input type="text" id="editUserName" required>
                </div>

                <div class="form-group">
                    <label>Hak Akses (Role)</label>
                    <select id="editUserRole">
                        <option value="user" style="color: black;">User / Client Biasa</option>
                        <option value="admin" style="color: black;">Admin (Staff)</option>
                        <option value="super_admin" style="color: black;">Super Admin (Pemilik)</option>
                    </select>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button type="button" onclick="closeModal()" style="flex: 1; padding: 12px; background: transparent; color: white; border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer;">Batal</button>
                    <button type="submit" style="flex: 1; padding: 12px; background: white; color: black; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/admin-loader.js"></script>
    <script>
        const token = localStorage.getItem('adminToken');
        
        document.addEventListener("DOMContentLoaded", () => {
            const userRole = localStorage.getItem('userRole');
            // Proteksi: Hanya Super Admin & Admin yang bisa akses
            if (!token || (userRole !== 'admin' && userRole !== 'super_admin')) {
                alert("Akses ditolak! Halaman ini hanya untuk Admin.");
                window.location.href = '../login.html';
                return;
            }
            fetchUsers();
        });

        async function fetchUsers() {
            const tbody = document.getElementById('usersTableBody');
            try {
                const response = await fetch('http://localhost:5000/api/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const users = await response.json();
                    tbody.innerHTML = '';

                    if (users.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Belum ada akun terdaftar.</td></tr>';
                        return;
                    }

                    users.forEach(user => {
                        let roleBadge = 'user';
                        let roleName = 'User';
                        if (user.role === 'super_admin') { roleBadge = 'super_admin'; roleName = 'Super Admin'; }
                        else if (user.role === 'admin') { roleBadge = 'admin'; roleName = 'Admin'; }

                        tbody.innerHTML += `
                            <tr>
                                <td style="font-weight: 600;">${user.nama_lengkap}</td>
                                <td style="color: var(--text-muted);">${user.email}</td>
                                <td><span class="badge ${roleBadge}">${roleName}</span></td>
                                <td>
                                    <button class="action-btn edit-btn" onclick="openEditModal('${user.id}', '${user.nama_lengkap}', '${user.email}', '${user.role}')">Edit</button>
                                    <button class="action-btn del-btn" onclick="deleteUser('${user.id}')">Hapus</button>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (err) {
                console.error("Gagal menarik data pengguna:", err);
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">Koneksi ke server gagal.</td></tr>';
            }
        }

        const modal = document.getElementById('editModal');
        
        function openEditModal(id, name, email, role) {
            document.getElementById('editUserId').value = id;
            document.getElementById('editUserName').value = name;
            document.getElementById('editUserEmail').value = email;
            document.getElementById('editUserRole').value = role;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editUserId').value;
            const nama_lengkap = document.getElementById('editUserName').value;
            const role = document.getElementById('editUserRole').value;

            try {
                const response = await fetch(`http://localhost:5000/api/users/${id}`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ nama_lengkap, role })
                });

                if (response.ok) {
                    alert("Akun berhasil diperbarui!");
                    closeModal();
                    fetchUsers(); 
                } else {
                    alert("Gagal memperbarui akun.");
                }
            } catch (err) {
                alert("Terjadi kesalahan pada server.");
            }
        });

        async function deleteUser(id) {
            if (confirm("Apakah Anda yakin ingin menghapus akun ini secara permanen?")) {
                try {
                    const response = await fetch(`http://localhost:5000/api/users/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (response.ok) {
                        alert("Akun berhasil dihapus.");
                        fetchUsers(); 
                    } else {
                        alert("Gagal menghapus akun.");
                    }
                } catch (err) {
                    alert("Terjadi kesalahan pada server.");
                }
            }
        }
    </script>
</body>
</html>
