<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insight | Halframe Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Memanggil CSS Modular -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/typography.css"> <!-- Tambahan khusus teks -->
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>

    <!-- NAVIGASI -->
    <!-- Cukup letakkan ini di bawah <body> -->
    <div id="public-nav-placeholder"></div> 

    <!-- PAGE HEADER -->
    <header class="page-header">
        <h1>INSIGHT & JOURNAL</h1>
        <p class="description">Pemikiran, proses kreatif, dan cerita di balik layar dari tim Halframe.</p>
    </header>

    <!--search-->
    <div style="width: 100%; max-width: 1720px; margin: 0 auto; padding: 0 40px; display: flex; justify-content: flex-end; margin-bottom: 5px; margin-top: 80px;">
        <input type="text" id="publicSearchInput" placeholder="Cari artikel jurnal..." style="padding: 10px 18px; width: 260px; background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; outline: none;">
    </div>

    <!-- INSIGHT SECTION -->
    <section class="insight-section" id="public-insight-section" style="margin-top: 30px; margin-bottom: 80px;">
        <!-- Artikel dari database Supabase akan otomatis dimuat secara dinamis di sini -->
        <div style="text-align: center; color: var(--text-muted); padding: 50px 0;">Memuat jurnal artikel...</div>
    </section>

    <!-- FOOTER -->
    <!-- PENAMPUNG FOOTER OTOMATIS -->
    <div id="public-footer-placeholder"></div>

    <!-- Memanggil Javascript Modular -->
    <script src="js/main.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
