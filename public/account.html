<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard | Halframe Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/forms.css"> 
    <link rel="stylesheet" href="css/animations.css">

    <style>
        /* Gaya khusus untuk Layout Dashboard Client */
        .dashboard-container {
            display: flex; gap: 40px; max-width: 1200px; margin: 0 auto; align-items: flex-start;
        }
        
        /* Sidebar Menu Kiri */
        .dashboard-menu {
            width: 250px; background: var(--bg-card); border: 1px solid var(--border-color); 
            border-radius: 8px; padding: 20px 0; flex-shrink: 0;
        }
        .menu-item {
            display: block; padding: 15px 30px; color: var(--text-muted); text-decoration: none; 
            font-size: 0.9rem; transition: all 0.3s ease; border-left: 3px solid transparent; cursor: pointer;
        }
        .menu-item:hover {
            color: var(--text-light); background: rgba(255,255,255,0.02);
        }
        .menu-item.active {
            color: var(--text-light); background: rgba(255,255,255,0.05); border-left-color: var(--accent);
        }

        /* Area Konten Kanan */
        .dashboard-content {
            flex: 1; background: var(--bg-card); border: 1px solid var(--border-color); 
            border-radius: 8px; padding: 40px; min-height: 500px;
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; animation: fadeIn 0.4s ease; }

        /* Kartu Data (Untuk Booking/History) */
        .data-card {
            border: 1px solid var(--border-color); background: rgba(0,0,0,0.3); padding: 20px; 
            border-radius: 6px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .status-badge {
            padding: 6px 12px; border-radius: 4px; font-size: 0.75rem; text-transform: uppercase; font-weight: 600;
        }
        .status-pending { background: rgba(255, 183, 3, 0.1); color: #ffb703; border: 1px solid rgba(255, 183, 3, 0.3); }
        .status-approved { background: rgba(46, 204, 113, 0.1); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); }
        .status-done { background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body style="background-color: var(--bg-dark);">

    <!-- NAVBAR PUBLIK -->
    <div id="public-nav-placeholder"></div> 

    <!-- PAGE HEADER -->
    <header class="page-header" style="padding-top: 140px; padding-bottom: 20px;">
        <h1>CLIENT PORTAL</h1>
        <p class="description">Kelola profil, pantau status booking, dan lihat riwayat proyek Anda.</p>
    </header>

    <!-- DASHBOARD SECTION (Tambahkan margin-top: 50px di sini) -->
    <section class="booking-section" style="margin-top: 50px; margin-bottom: 100px; padding: 0 5%;">
        <div class="dashboard-container reveal">
            
            <!-- 1. SIDEBAR MENU -->
            <div class="dashboard-menu">
                <div style="padding: 0 30px 20px 30px; border-bottom: 1px solid var(--border-color); margin-bottom: 10px;">
                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px;">Welcome back,</div>
                    <div id="displayUserName" style="font-family: var(--font-head); font-weight: 700; font-size: 1.1rem; color: white; word-break: break-all;">User</div>
                </div>
                
                <a class="menu-item active" onclick="switchTab('tab-profile')">Pengaturan Akun</a>
                <a class="menu-item" onclick="switchTab('tab-bookings')">Booking Aktif</a>
                <a class="menu-item" onclick="switchTab('tab-history')">Riwayat Proyek</a>
                <a class="menu-item" style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 20px; color: #e50914;" id="logoutBtn">Log Out</a>
            </div>

            <!-- 2. KONTEN DASHBOARD -->
            <div class="dashboard-content">
                
                <!-- TAB: PENGATURAN AKUN -->
                <div id="tab-profile" class="tab-pane active">
                    <h2 style="font-size: 1.5rem; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">Pengaturan Akun</h2>
                    
                    <form id="accountForm">
                        <div class="form-group">
                            <label for="accName">Nama Lengkap / Perusahaan</label>
                            <input type="text" id="accName" required>
                        </div>
                        <div class="form-group">
                            <label for="accEmail">Email Login (Tidak dapat diubah)</label>
                            <input type="email" id="accEmail" disabled value="Memuat data..." style="opacity: 0.5; cursor: not-allowed;">
                        </div>

                        <h3 style="font-size: 1.1rem; margin-top: 40px; margin-bottom: 20px;">Keamanan Kata Sandi</h3>
                        <div class="form-group">
                            <label for="oldPassword">Kata Sandi Lama</label>
                            <input type="password" id="oldPassword" placeholder="Isi jika ingin mengubah kata sandi">
                        </div>
                        <div class="form-group">
                            <label for="newPassword">Kata Sandi Baru</label>
                            <input type="password" id="newPassword" placeholder="Minimal 8 karakter">
                        </div>

                        <button type="submit" class="btn-primary" style="margin-top: 10px;">Simpan Perubahan</button>
                    </form>
                </div>

                <!-- TAB: BOOKING AKTIF -->
                <!-- TAB: BOOKING AKTIF -->
                <div id="tab-bookings" class="tab-pane">
                    <!-- Konten akan diisi otomatis oleh JavaScript renderBookings() -->
                    <div style="text-align: center; color: var(--text-muted); padding: 40px;">Memuat data...</div>
                </div>

                <!-- TAB: RIWAYAT PROYEK -->
                <div id="tab-history" class="tab-pane">
                    <!-- Konten akan diisi otomatis oleh JavaScript renderBookings() -->
                    <div style="text-align: center; color: var(--text-muted); padding: 40px;">Memuat data...</div>
                </div>


            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <!-- PENAMPUNG FOOTER OTOMATIS -->
    <div id="public-footer-placeholder"></div>

    <!-- Memanggil Javascript Modular -->
    <script src="js/main.js"></script>
    <script src="js/animations.js"></script>

   <script>
        // Fungsi untuk berpindah Tab
        function switchTab(tabId) {
            document.querySelectorAll('.tab-pane').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(menu => menu.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem('adminToken');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            // Elemen Form Profil
            const accNameInput = document.getElementById('accName');
            const accEmailInput = document.getElementById('accEmail');
            const displayUserName = document.getElementById('displayUserName');
            
            // Set nama sementara
            displayUserName.textContent = localStorage.getItem('adminName') || "User";

            // 1. BLOK TARIK DATA PROFIL
            try {
                const profileRes = await fetch('http://localhost:5000/api/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (profileRes.ok) {
                    const userData = await profileRes.json();
                    
                    // Isi form profil
                    displayUserName.textContent = userData.nama_lengkap;
                    accNameInput.value = userData.nama_lengkap;
                    accEmailInput.value = userData.email;
                    
                    // Update storage
                    localStorage.setItem('adminName', userData.nama_lengkap);
                } else {
                    accNameInput.value = "Gagal memuat nama";
                    accEmailInput.value = "Gagal memuat email";
                    console.error("Error Profil:", profileRes.status);
                }
            } catch (err) {
                accNameInput.value = "Koneksi terputus";
                accEmailInput.value = "Koneksi terputus";
                console.error("Gagal menarik data profil:", err);
            }

            // 2. BLOK TARIK DATA BOOKING
            try {
                const bookingRes = await fetch('http://localhost:5000/api/my-bookings', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (bookingRes.ok) {
                    const bookings = await bookingRes.json();
                    renderBookings(bookings);
                } else {
                    renderBookings([]); 
                }
            } catch (err) {
                console.error("Gagal menarik riwayat booking:", err);
                renderBookings([]); 
            }
            
            // 3. LOGIKA LOG OUT
            document.getElementById('logoutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                if(confirm("Apakah Anda yakin ingin keluar?")) {
                    localStorage.clear();
                    window.location.href = 'index.html';
                }
            });

            // 4. SIMPAN PERUBAHAN PROFIL
            const accountForm = document.getElementById('accountForm');
            accountForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const submitBtn = accountForm.querySelector('button[type="submit"]');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = "Menyimpan...";
                submitBtn.style.pointerEvents = "none";

                const nama_lengkap = document.getElementById('accName').value;
                const old_password = document.getElementById('oldPassword').value;
                const new_password = document.getElementById('newPassword').value;

                try {
                    const response = await fetch('http://localhost:5000/api/profile', {
                        method: 'PUT',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}` 
                        },
                        body: JSON.stringify({ nama_lengkap, old_password, new_password })
                    });

                    const result = await response.json();
                    if (response.ok) {
                        alert("Profil berhasil diperbarui!");
                        displayUserName.textContent = result.user.nama_lengkap;
                        localStorage.setItem('adminName', result.user.nama_lengkap);
                        document.getElementById('oldPassword').value = '';
                        document.getElementById('newPassword').value = '';
                    } else {
                        alert("Gagal: " + (result.message || "Terjadi kesalahan"));
                    }
                } catch (err) {
                    alert("Gagal terhubung ke server.");
                } finally {
                    submitBtn.textContent = originalText;
                    submitBtn.style.pointerEvents = "auto";
                }
            });
        });

        // FUNGSI RENDER BOOKING (Sudah kebal error)
        function renderBookings(bookings) {
            const activeContainer = document.getElementById('tab-bookings');
            const historyContainer = document.getElementById('tab-history');

            let activeHTML = `<h2 style="font-size: 1.5rem; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">Booking Aktif Anda</h2>`;
            let historyHTML = `<h2 style="font-size: 1.5rem; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">Riwayat Proyek Selesai</h2>`;

            let hasActive = false;
            let hasHistory = false;

            if (Array.isArray(bookings) && bookings.length > 0) {
                bookings.forEach(b => {
                    const dateObj = new Date(b.target_date);
                    const dateStr = isNaN(dateObj) ? '-' : dateObj.toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'});
                    
                    const status = (b.status || '').toLowerCase();
                    if (status === 'selesai' || status === 'completed' || status === 'done') {
                        hasHistory = true;
                        historyHTML += `
                            <div class="data-card">
                                <div>
                                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px;">ID: ${b.booking_id}</div>
                                    <h4 style="font-size: 1.1rem; margin-bottom: 5px;">${b.service}</h4>
                                </div>
                                <div style="text-align: right;">
                                    <div class="status-badge status-done" style="margin-bottom: 10px; display: inline-block;">Selesai</div>
                                    <br>
                                    ${b.deliverable_link ? `<a href="${b.deliverable_link}" target="_blank" style="color: var(--text-light); font-size: 0.8rem; text-decoration: underline;">Unduh Hasil Final</a>` : ''}
                                </div>
                            </div>
                        `;
                    } else {
                        hasActive = true;
                        let badgeClass = 'status-pending';
                        if (status.includes('progress') || status.includes('approved')) {
                            badgeClass = 'status-approved';
                        }
                        activeHTML += `
                            <div class="data-card">
                                <div>
                                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px;">ID: ${b.booking_id}</div>
                                    <h4 style="font-size: 1.1rem; margin-bottom: 5px;">${b.service}</h4>
                                    <div style="font-size: 0.85rem; color: var(--text-muted);">Target: ${dateStr}</div>
                                </div>
                                <div class="status-badge ${badgeClass}">${b.status || 'Pending'}</div>
                            </div>
                        `;
                    }
                });
            }

            if (!hasActive) activeHTML += `<p style="color: var(--text-muted); font-size: 0.9rem;">Anda belum memiliki permintaan booking aktif. <a href="booking.html" style="color: var(--accent);">Mulai proyek baru?</a></p>`;
            if (!hasHistory) historyHTML += `<p style="color: var(--text-muted); font-size: 0.9rem;">Belum ada riwayat proyek yang selesai.</p>`;

            activeContainer.innerHTML = activeHTML;
            historyContainer.innerHTML = historyHTML;
        }
    </script>

</body>
</html>
