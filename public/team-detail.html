<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crew Detail | Halframe Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <!-- NAVIGASI -->
    <!-- Cukup letakkan ini di bawah <body> -->
    <div id="public-nav-placeholder"></div> 

    <!-- DETAIL CONTAINER -->
    <main style="padding: 120px 5% 100px; min-height: 70vh;" id="detail-container">
        <h2 style="text-align: center; color: var(--text-muted); margin-top: 50px;">Memuat data profil kru...</h2>
    </main>

    <!-- FOOTER -->
    <!-- PENAMPUNG FOOTER OTOMATIS -->
    <div id="public-footer-placeholder"></div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const memberId = urlParams.get('id');
            const detailContainer = document.getElementById('detail-container');

            if (!memberId) {
                detailContainer.innerHTML = `<h2 style="text-align: center; color: red;">ID Kru tidak valid.</h2>`;
                return;
            }

            try {
                const response = await fetch(`http://localhost:5000/api/team/${memberId}`);
                if (!response.ok) throw new Error("Kru tidak ditemukan");
                
                const member = await response.json();
                
                const dob = member.dob ? new Date(member.dob).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '-';
                const photoUrl = member.photo_url || 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=600&auto=format&fit=crop';
                const portfolioBtn = member.portfolio_link ? `<a href="${member.portfolio_link}" target="_blank" class="btn-primary" style="display:inline-block; margin-top:20px; padding:10px 25px;">Lihat Portofolio</a>` : '';

                detailContainer.innerHTML = `
                    <div style="max-width: 900px; margin: 0 auto; animation: fadeIn 0.5s ease;">
                        <a href="team.html" style="display: inline-flex; align-items: center; gap: 8px; color: var(--text-light); text-decoration: none; font-size: 0.9rem; padding: 8px 16px; border: 1px solid var(--border-color); border-radius: 4px; background: rgba(255,255,255,0.05); margin-bottom: 40px;">
                            <span>&larr;</span>
                        </a>

                        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 50px; align-items: start;">
                            
                            <!-- Foto Profil -->
                            <div style="border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; overflow: hidden; padding: 10px; background: rgba(0,0,0,0.2);">
                                <img src="${photoUrl}" alt="${member.full_name}" style="width: 100%; border-radius: 4px; display: block; object-fit: cover; aspect-ratio: 4/5;">
                            </div>

                            <!-- Biodata -->
                            <div>
                                <h1 style="font-size: 2.5rem; margin-bottom: 5px; text-transform: uppercase;">${member.full_name}</h1>
                                <p style="color: var(--accent); font-family: 'Orbitron', sans-serif; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px;">${member.role}</p>
                                
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; padding: 20px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px;">
                                    <div>
                                        <h4 style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px;">Nama Panggilan</h4>
                                        <p>${member.nickname}</p>
                                    </div>
                                    <div>
                                        <h4 style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px;">Pendidikan</h4>
                                        <p>${member.education || '-'}</p>
                                    </div>
                                    <div style="grid-column: 1 / -1;">
                                        <h4 style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px;">Tempat, Tanggal Lahir</h4>
                                        <p>${member.pob || '-'}, ${dob}</p>
                                    </div>
                                </div>

                                <h3 style="font-size: 1.2rem; margin-bottom: 15px; font-weight: 500;">Profil Singkat</h3>
                                <p style="line-height: 1.8; color: var(--text-light); white-space: pre-wrap;">${member.bio || 'Belum ada bio.'}</p>
                                
                                ${portfolioBtn}
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                detailContainer.innerHTML = `<h2 style="text-align: center; color: red;">Gagal memuat profil. Pastikan server berjalan.</h2>`;
            }
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>
