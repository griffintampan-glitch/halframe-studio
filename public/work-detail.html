<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail | Halframe Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>

    <!-- NAVIGASI -->
    <!-- Cukup letakkan ini di bawah <body> -->
    <div id="public-nav-placeholder"></div> 

    <!-- PROJECT DETAIL CONTAINER -->
    <main style="padding: 120px 5% 50px; min-height: 70vh;" id="detail-container">
        <!-- Teks loading awal sebelum data ditarik -->
        <h2 style="text-align: center; color: var(--text-muted); margin-top: 50px;">Memuat data proyek...</h2>
    </main>

    <!-- FOOTER -->
    <!-- PENAMPUNG FOOTER OTOMATIS -->
    <div id="public-footer-placeholder"></div>

    <!-- SCRIPT PENARIK DATA DETAIL PROYEK -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // 1. Ambil ID dari URL (contoh: work-detail.html?id=5)
            const urlParams = new URLSearchParams(window.location.search);
            const workId = urlParams.get('id');
            const detailContainer = document.getElementById('detail-container');

            if (!workId) {
                detailContainer.innerHTML = `<h2 style="text-align: center; color: red; margin-top: 50px;">ID Proyek tidak valid.</h2>`;
                return;
            }

            try {
                // 2. Tarik data spesifik berdasarkan ID
                const response = await fetch(`http://localhost:5000/api/works/${workId}`);
                
                if (!response.ok) {
                    throw new Error("Proyek tidak ditemukan");
                }
                
                const work = await response.json();
                
                // Format tanggal agar lebih rapi membaca (opsional)
                const formattedDate = work.work_date ? new Date(work.work_date).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : 'Tanggal tidak tersedia';
                const imageUrl = work.image_url || 'https://images.unsplash.com/photo-1604242692760-2f7b0c26856d?q=80&w=1200&auto=format&fit=crop';

                // 3. Render HTML dengan data asli
                detailContainer.innerHTML = `
                    <div style="max-width: 900px; margin: 0 auto; animation: fadeIn 0.5s ease;">
                        
                        <!-- Tombol Back (Kembali) -->
                        <div style="margin-bottom: 30px;">
                            <a href="works.html" style="display: inline-flex; align-items: center; gap: 8px; color: var(--text-light); text-decoration: none; font-size: 0.9rem; padding: 8px 16px; border: 1px solid var(--border-color); border-radius: 4px; background: rgba(255,255,255,0.05); transition: background 0.3s ease;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">
                                <span>&larr;</span>
                            </a>
                        </div>

                        <!-- Header Proyek -->
                        <div style="text-align: center; margin-bottom: 40px;">
                            <h1 style="font-size: 2.5rem; margin-bottom: 10px; text-transform: uppercase;">${work.title}</h1>
                            <p style="color: var(--accent); letter-spacing: 2px; text-transform: uppercase; font-size: 0.9rem;">${work.category}</p>
                        </div>

                        <!-- Gambar Proyek -->
                        <div style="width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                            <img src="${imageUrl}" alt="${work.title}" style="width: 100%; height: auto; display: block;">
                        </div>

                        <!-- Info Grid & Deskripsi -->
                        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 40px;">
                            
                            <!-- Sidebar Info -->
                            <div style="background: var(--bg-card); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color); height: fit-content;">
                                <div style="margin-bottom: 20px;">
                                    <h4 style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px;">Tanggal Produksi</h4>
                                    <p style="font-size: 1rem;">${formattedDate}</p>
                                </div>
                                <div>
                                    <h4 style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px;">Lokasi</h4>
                                    <p style="font-size: 1rem;">${work.location || '-'}</p>
                                </div>
                            </div>

                            <!-- Deskripsi Utama -->
                            <div style="line-height: 1.8; color: var(--text-light); font-size: 1.05rem;">
                                <h3 style="font-size: 2.0rem; margin-bottom: 20px; font-weight: 500;">Description</h3>
                                <p style="white-space: pre-wrap;">${work.description}</p>
                            </div>
                        </div>

                    </div>
                `;
            } catch (err) {
                console.error("Gagal menarik detail proyek:", err);
                detailContainer.innerHTML = `<h2 style="text-align: center; color: red; margin-top: 50px;">Gagal memuat proyek. Pastikan server lokal menyala.</h2>`;
            }
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>
