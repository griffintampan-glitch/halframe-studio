<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works | Halframe Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Memanggil CSS Modular -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>

    <!-- NAVIGASI -->
    <!-- Cukup letakkan ini di bawah <body> -->
    <div id="public-nav-placeholder"></div> 

    <!-- PAGE HEADER -->
    <header class="page-header">
        <h1>OUR ARCHIVE</h1>
        <p class="description">Koleksi eksplorasi visual kami di berbagai medium.</p>
    </header>

    

    <!-- PORTFOLIO SECTION -->
    <section class="portfolio-section" style="padding-top: 20px;">
        
        <!-- WRAPPER UTAMA: Menggunakan Grid 3 Kolom -->
        <div style="width: 100%; max-width: 1250px; margin: 0 auto 30px auto; padding: 0 40px; display: grid; grid-template-columns: 260px 1fr 260px; align-items: center; gap: 20px;">
            
            <!-- Kolom 1 (Kiri): Penyeimbang -->
            <div></div>

            <!-- Kolom 2 (Tengah): Area Filter Scroll -->
            <div style="overflow-x: auto; white-space: nowrap; text-align: center; scrollbar-width: none; -ms-overflow-style: none;">
                <!-- KELAS 'reveal' DIHAPUS DARI SINI -->
                <!-- TOMBOL FILTER DENGAN KATA KUNCI PENDEK -->
                <div class="filters" style="display: inline-flex; flex-wrap: nowrap !important; gap: 8px; margin: 0; padding-bottom: 5px;">
                    <button class="filter-btn active" data-filter="all">ALL</button>
                    <button class="filter-btn" data-filter="graduation">GRADUATION</button>
                    <button class="filter-btn" data-filter="wedding">WEDDING</button>
                    <button class="filter-btn" data-filter="event">EVENT</button>
                    <button class="filter-btn" data-filter="product">PRODUCT PHOTO</button>
                    <button class="filter-btn" data-filter="commercial">COMMERCIAL VIDEO</button>
                    <button class="filter-btn" data-filter="branding">BRANDING</button>
                    <button class="filter-btn" data-filter="company">COMPANY PROFILE</button>
                    <button class="filter-btn" data-filter="brand film">BRAND FILM</button>
                    <button class="filter-btn" data-filter="social">SOCIAL MEDIA</button>
                    <button class="filter-btn" data-filter="short film">SHORT FILM</button>
                    <button class="filter-btn" data-filter="music">MUSIC VIDEO</button>
                    <button class="filter-btn" data-filter="documentary">DOCUMENTARY</button>
                    <button class="filter-btn" data-filter="editing">VIDEO EDITING</button>
                    <button class="filter-btn" data-filter="streaming">LIVE STREAMING</button>
                </div>
            </div>

            <!-- Kolom 3 (Kanan): Kotak Pencarian -->
            <div style="display: flex; justify-content: flex-end;">
                <input type="text" id="publicSearchInput" placeholder="Cari judul proyek..." style="padding: 10px 18px; width: 100%; background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; outline: none;">
            </div>

        </div>

        <!-- WORKS GRID -->
        <div class="works-grid" id="portfolio-grid">
            
        </div>
    </section>  

    <!-- FOOTER -->
    <!-- PENAMPUNG FOOTER OTOMATIS -->
    <div id="public-footer-placeholder"></div>

    <!-- Memanggil Javascript Modular -->
    <script src="js/main.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
